name: Build AGT Blocker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AGT Blocker source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - name: Install Android SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "ndk;26.1.10909125"

      - name: Install gomobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Ptunnel.source=local assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGT-Blocker-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
